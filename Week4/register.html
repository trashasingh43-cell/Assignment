
<!DOCTYPE html>

<head>

<body>

    <nav>
        <a href="index.html">Home</a> |

        <a href="contact.html">Contact</a>

    <h1>Join Tech Club</h1>
    <p>Fill in your details to register for club activities.</p>

    <form action="#" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="branch">Branch:</label>
        <select id="branch" name="branch">
            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
            <option>Robotics & Automation</option>
            <option>Cyber Security</option>
        </select>
        <br><br>

        <label for="reason">Why do you want to join?</label>
        <br>
        <textarea id="reason" name="reason" rows="4" cols="30"></textarea>
        <br><br>

        <button type="submit">Register</button>

    </form>

    <footer>
        <p>&copy; 2026 Tech Club</p>
    </footer>

</body>
</html>
